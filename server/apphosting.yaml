# apphosting.yaml (Recommended structure for Firebase App Hosting)

# 1. Server Configuration (Defines the build and run process)
server:
  # The command to run before starting the server (e.g., installing dependencies)
  # This is the equivalent of your 'build: cmd'
  buildCommand: "npm install"

  # The command to execute to start your production Node.js server.
  # This is the equivalent of your 'run: cmd'
  runCommand: "npm run start"

  # Specify the directory containing your main server code
  # The contents of this directory (relative to the project root) 
  # are copied to the container's /workspace.
  source: .

# Configuration for Cloud Run
runConfig:
  minInstances: 1 # Keep 1 instance alive for production speed (optional cost)

env:
  - variable: GOOGLE_CLOUD_PROJECT
    value: energreen-ai-powered-iot-based

  - variable: GEMINI_API_KEY
    secret: VITE_GEMINI_API_KEY

  - variable: GOOGLE_CUSTOM_SEARCH_API_KEY
    secret: VITE_GOOGLE_CUSTOM_SEARCH_API_KEY

  - variable: GOOGLE_SEARCH_ENGINE_ID
    secret: VITE_GOOGLE_SEARCH_ENGINE_ID

  - variable: APP_READ_API_URL
    secret: VITE_APP_READ_API_URL

  - variable: APP_UPDATE_API_URL
    secret: VITE_APP_UPDATE_API_URL

  - variable: PREDICT_URL
    secret: VITE_PREDICT_URL

  - variable: TRAINING_API_URL
    secret: VITE_TRAINING_API_URL

  - variable: CLUSTER_URL
    secret: VITE_CLUSTER_URL

  - variable: FORECAST_URL
    secret: VITE_FORECAST_URL

  - variable: SUSPEND_USER_URL
    secret: VITE_SUSPEND_USER_URL

  - variable: DELETE_USER_URL
    secret: VITE_DELETE_USER_URL

  - variable: ENABLE_USER_URL
    secret: VITE_ENABLE_USER_URL

  - variable: STORAGE_BUCKET
    value: energreen-ai-powered-iot-based.firebasestorage.app