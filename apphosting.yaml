# Configuration for your Cloud Run service
runConfig:
  minInstances: 0
  # maxInstances: 100

  # Environment variables and secrets.
env:
  # --------------------------------------------------------------------------
  # 1. PUBLIC/CLIENT CONFIGURATION KEYS (Value is available to Build & Runtime)
  # --------------------------------------------------------------------------
  - variable: VITE_FIREBASE_API_KEY
    value: "AIzaSyDAeHiKHEXHhbIXNnw0zqiDUIEPfDfeiuo"
  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: "energreen-ai-powered-iot-based.firebaseapp.com"
  - variable: VITE_FIREBASE_PROJECT_ID
    value: "energreen-ai-powered-iot-based"
  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: "energreen-ai-powered-iot-based.firebasestorage.app"
  - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
    value: "91407391585"
  - variable: VITE_FIREBASE_APP_ID
    value: "1:91407391585:web:9bf0e0f013514392988320"

  # --------------------------------------------------------------------------
  # 2. SENSITIVE SECRETS (Must be stored in Secret Manager)
  #    - The variable name IS NOT exposed to the client (browser).
  # --------------------------------------------------------------------------
  - variable: GEMINI_API_KEY
    secret: VITE_GEMINI_API_KEY

  - variable: APP_READ_API_URL
    secret: VITE_APP_READ_API_URL

  - variable: APP_UPDATE_API_URL
    secret: VITE_APP_UPDATE_API_URL

  - variable: PREDICT_URL
    secret: VITE_PREDICT_URL

  - variable: TRAINING_API_URL
    secret: VITE_TRAINING_API_URL

  - variable: CLUSTER_URL
    secret: VITE_CLUSTER_URL

  - variable: FORECAST_URL
    secret: VITE_FORECAST_URL

  - variable: SUSPEND_USER_URL
    secret: VITE_SUSPEND_USER_URL

  - variable: DELETE_USER_URL
    secret: VITE_DELETE_USER_URL

  - variable: ENABLE_USER_URL
    secret: VITE_ENABLE_USER_URL

# --------------------------------------------------------------------------
# 3. SERVICE CONFIGURATION (To deploy the Express proxy server)
# --------------------------------------------------------------------------
service:
  # A name for the Cloud Run service instance, which will be created 
  # inside the backend resource defined below.
  name: api-server 

  # Points to the directory containing your Express app (server/index.js)
  source: ./server 

  # Rewrite rule to direct internal API calls to the new Cloud Run service
  rewrite:
    source: /api/admin/**
    # CRITICAL CHANGE: Use the backend resource name here
    destination: energreen-vue-proxy-backend