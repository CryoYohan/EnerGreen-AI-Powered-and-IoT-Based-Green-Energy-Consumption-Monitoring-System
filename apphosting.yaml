# apphosting.yaml
runtime: nodejs22
build:
  cmd: npm install
run:
  cmd: node server/index.js

# Configuration for Cloud Run
runConfig:
  minInstances: 1 # Keep 1 instance alive for production speed (optional cost)
  
env:
  - variable: GOOGLE_CLOUD_PROJECT
    value: energreen-ai-powered-iot-based

  - variable: GEMINI_API_KEY
    secret: VITE_GEMINI_API_KEY

  - variable: APP_READ_API_URL
    secret: VITE_APP_READ_API_URL

  - variable: APP_UPDATE_API_URL
    secret: VITE_APP_UPDATE_API_URL

  - variable: PREDICT_URL
    secret: VITE_PREDICT_URL

  - variable: TRAINING_API_URL
    secret: VITE_TRAINING_API_URL

  - variable: CLUSTER_URL
    secret: VITE_CLUSTER_URL

  - variable: FORECAST_URL
    secret: VITE_FORECAST_URL

  - variable: SUSPEND_USER_URL
    secret: VITE_SUSPEND_USER_URL

  - variable: DELETE_USER_URL
    secret: VITE_DELETE_USER_URL

  - variable: ENABLE_USER_URL
    secret: VITE_ENABLE_USER_URL
